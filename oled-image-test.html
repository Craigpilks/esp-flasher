<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>ESP32 OLED Image Test</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 650px;
      margin: 40px auto;
      padding: 20px;
      text-align: center;
      background: #f4f6f8;
    }

    .box {
      background: white;
      padding: 25px;
      border-radius: 10px;
    }

    canvas {
      width: 512px;
      height: 256px;
      max-width: 100%;
      image-rendering: pixelated;
      border: 2px solid black;
      margin: 20px 0;
      background: black;
    }

    button {
      padding: 10px 18px;
      margin: 5px;
      font-size: 16px;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>ESP32 OLED Image Test</h1>

  <p>Choose an image and send it to the 128×64 OLED.</p>

  <button id="connectButton">Connect ESP32</button>

  <br><br>

<p>
  Need an OLED picture?
  <a href="https://moonbench.xyz/projects/1-bit-oled-art-gallery/"
     target="_blank">
    Open the 1-Bit OLED Art Gallery
  </a>
</p>

<p>
  Choose a 128×64 image, download it to your Chromebook,
  then upload it below.
</p>

  <input type="file" id="imageInput" accept="image/*">

  <br>

<p>
  Adjust Image:
  <input type="range" id="threshold" min="0" max="255" value="128">
  <span id="thresholdValue">128</span>
</p>

  <canvas id="canvas" width="128" height="64"></canvas>

  <br>

  <button id="sendButton">Send Image to OLED</button>

  <p id="status">Not connected</p>

</div>


<script>

let port;
let writer;
let originalImage = null;

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");


// ==========================================
// CONNECT TO ESP32
// ==========================================

document.getElementById("connectButton").addEventListener("click", async () => {

  try {

    port = await navigator.serial.requestPort();

    await port.open({
      baudRate: 115200
    });

    writer = port.writable.getWriter();

    document.getElementById("status").textContent =
      "ESP32 Connected!";

  } catch (error) {

    document.getElementById("status").textContent =
      "Connection failed: " + error;

  }

});


// ==========================================
// LOAD IMAGE
// ==========================================

document.getElementById("imageInput").addEventListener("change", function(event) {

  const file = event.target.files[0];

  if (!file) return;

  const img = new Image();

  img.onload = function() {
	originalImage = img

    // Black background
    ctx.fillStyle = "black";
    ctx.fillRect(0, 0, 128, 64);

    // Keep the image's proportions
    const scale = Math.min(
      128 / img.width,
      64 / img.height
    );

    const width = img.width * scale;
    const height = img.height * scale;

    const x = (128 - width) / 2;
    const y = (64 - height) / 2;

    // Draw image
    ctx.drawImage(
      img,
      x,
      y,
      width,
      height
    );

    // Convert image to black and white
    const imageData =
      ctx.getImageData(0, 0, 128, 64);

    const pixels = imageData.data;

    for (let i = 0; i < pixels.length; i += 4) {

      const brightness =
        (pixels[i] +
         pixels[i + 1] +
         pixels[i + 2]) / 3;

      const value =
        brightness > 128 ? 255 : 0;

      pixels[i] = value;
      pixels[i + 1] = value;
      pixels[i + 2] = value;

    }

    ctx.putImageData(imageData, 0, 0);

    URL.revokeObjectURL(img.src);

    document.getElementById("status").textContent =
      "Image ready to send.";

  };

  img.src = URL.createObjectURL(file);

});


// ==========================================
// SEND IMAGE
// ==========================================

document.getElementById("sendButton").addEventListener("click", async () => {

  if (!writer) {

    document.getElementById("status").textContent =
      "Connect the ESP32 first.";

    return;
  }


  document.getElementById("status").textContent =
    "Sending image...";


  // Tell ESP32 an image is coming
  await writer.write(
    new TextEncoder().encode("IMG\n")
  );


  // Give ESP32 a moment to prepare
  await new Promise(resolve =>
    setTimeout(resolve, 100)
  );


  const imageData =
    ctx.getImageData(0, 0, 128, 64);

  const pixels = imageData.data;

  const bitmap = new Uint8Array(1024);


  // ========================================
  // CONVERT 128x64 PIXELS INTO
  // ADAFRUIT GFX BITMAP FORMAT
  // ========================================

  for (let y = 0; y < 64; y++) {

    for (let x = 0; x < 128; x++) {

      const pixelIndex =
        (y * 128 + x) * 4;

      const brightness =
        pixels[pixelIndex];

      if (brightness > 128) {

        const byteIndex =
          y * 16 + Math.floor(x / 8);

        const bit =
          7 - (x % 8);

        bitmap[byteIndex] |=
          (1 << bit);
      }
    }
  }


  // Send all 1024 bytes
  await writer.write(bitmap);


  document.getElementById("status").textContent =
    "Image sent to OLED!";

});

// ==========================================
// THRESHOLD SLIDER
// ==========================================

document.getElementById("threshold").addEventListener("input", function() {

  const threshold = Number(this.value);

  document.getElementById("thresholdValue").textContent = threshold;

  if (!originalImage) return;

  // Clear canvas
  ctx.fillStyle = "black";
  ctx.fillRect(0, 0, 128, 64);

  // Resize image while keeping proportions
  const scale = Math.min(
    128 / originalImage.width,
    64 / originalImage.height
  );

  const width = originalImage.width * scale;
  const height = originalImage.height * scale;

  const x = (128 - width) / 2;
  const y = (64 - height) / 2;

  ctx.drawImage(
    originalImage,
    x,
    y,
    width,
    height
  );

  // Get pixels
  const imageData = ctx.getImageData(0, 0, 128, 64);
  const pixels = imageData.data;

  // Apply the selected threshold
  for (let i = 0; i < pixels.length; i += 4) {

    const brightness =
      (pixels[i] + pixels[i + 1] + pixels[i + 2]) / 3;

    const value =
      brightness > threshold ? 255 : 0;

    pixels[i] = value;
    pixels[i + 1] = value;
    pixels[i + 2] = value;
  }

  ctx.putImageData(imageData, 0, 0);

});
</script>

</body>
</html>
